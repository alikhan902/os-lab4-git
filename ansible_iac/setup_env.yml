---
- name: Настроить локальный веб-сервер
  hosts: local
  become: true
  tasks:
    - name: Установить Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Создать веб-страницу
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Инфраструктура настроена через Ansible (IaC)</h1>\n"
        mode: "0644"

    - name: Включить и запустить Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
