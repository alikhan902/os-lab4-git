name: CI and Docker Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck app_calculator.sh auth.sh
      - name: Run unit test
        run: |
          output=$(./app_calculator.sh 5 10)
          if [[ "$output" != "Сумма: 15" ]]; then
            echo "Тест провален: $output"
            exit 1
          fi
          echo "Тест успешно пройден!"

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t "my-app:$GITHUB_SHA" .
      - name: Test Docker container
        run: |
          docker run -d -p 127.0.0.1:8080:8080 --name test_app "my-app:$GITHUB_SHA"
          trap 'docker rm -f test_app' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/ | grep -F server.py

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate monitoring stack
        working-directory: monitoring
        run: docker compose config --quiet

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_iac
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible tools
        run: pipx install --include-deps ansible-lint
      - name: Validate playbook and inventory
        run: |
          ansible-lint setup_env.yml
          ansible local -i hosts.ini -m ping
          ansible-playbook -i hosts.ini setup_env.yml --syntax-check
      - name: Apply configuration and check idempotence
        run: |
          ansible-playbook -i hosts.ini setup_env.yml
          ansible-playbook -i hosts.ini setup_env.yml | tee /tmp/ansible-repeat.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' /tmp/ansible-repeat.log
          curl -fsS http://localhost | grep -F 'Инфраструктура настроена через Ansible (IaC)'
