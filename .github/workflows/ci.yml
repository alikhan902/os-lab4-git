name: Bash Script CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck app_calculator.sh auth.sh
      - name: Run unit test
        run: |
          output=$(./app_calculator.sh 5 10)
          if [[ "$output" != "Сумма: 15" ]]; then
            echo "Тест провален: $output"
            exit 1
          fi
          echo "Тест успешно пройден!"
